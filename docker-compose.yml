services:
  # --- База данных ---
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "15432:5432"       # наружу на 15432, внутри сети Docker — 5432
    volumes:
      - pgdata:/var/lib/postgresql/data   # данные сохраняются между перезапусками

  # --- Бэкенд (FastAPI) ---
  backend:
    build: .               # собирает образ из ./Dockerfile
    ports:
      - "8000:8000"
    environment:
      # внутри Docker-сети контейнеры видят друг друга по имени сервиса ("db"), не localhost!
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/postgres
    volumes:
      - .:/app             # монтируем весь бэкенд-код, чтобы изменения были видны сразу
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload  # --reload смотрит за изменениями файлов
    depends_on:
      - db                 # сначала запустится db, потом backend

  # --- Фронтенд (React) ---
  frontend:
    build: ./todo-app-frontend-master
    ports:
      - "3000:3000"
    volumes:
      - ./todo-app-frontend-master:/app        # монтируем исходный код
      - /app/node_modules                      # но node_modules — отдельный volume (чтобы не переписать установленные пакеты)
    depends_on:
      - backend

volumes:
  pgdata:                  # именованный volume — данные БД не пропадут при docker-compose down
